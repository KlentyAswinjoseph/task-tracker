<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specific Users Branch Analytics - Git Branch Tracker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .nav-links {
            margin-top: 15px;
        }

        .nav-links a {
            display: inline-block;
            margin-right: 20px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .filters {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .filter-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        .filter-group input, .filter-group select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 30px;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-weight: 500;
        }

        .branches-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .branches-table th,
        .branches-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .branches-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .branches-table tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #e8f5e8;
            color: #27ae60;
        }

        .status-merged {
            background: #e3f2fd;
            color: #1976d2;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #fcc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-users"></i>
                Specific Users Branch Analytics
            </h1>
            <p>Track branches and metrics for specific users (KlentyDhanush, KlentyAswinjoseph)</p>
            <div class="nav-links">
                <a href="index.html">
                    <i class="fas fa-code-branch"></i>
                    Branch Dashboard
                </a>
                <a href="tasks.html">
                    <i class="fas fa-tasks"></i>
                    Task Analytics
                </a>
                <a href="specific-users.html" style="background: #27ae60;">
                    <i class="fas fa-users"></i>
                    Specific Users
                </a>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div class="filter-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="merged">Merged</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="taskIdFilter">Task ID</label>
                    <input type="text" id="taskIdFilter" placeholder="e.g., SQ2-1132">
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" onclick="loadSpecificUsers()">
                        <i class="fas fa-filter"></i>
                        Load Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading user data...</p>
        </div>

        <!-- Error -->
        <div class="error" id="error" style="display: none;"></div>

        <!-- User Summaries -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-chart-bar"></i>
                    User Summaries
                </h2>
            </div>
            <div id="userSummaries">
                <!-- User summaries will be populated here -->
            </div>
        </div>

        <!-- Branches Table -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-table"></i>
                    Branches (KlentyDhanush & KlentyAswinjoseph)
                </h2>
            </div>
            <div id="branchesTable">
                <!-- Branches table will be populated here -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            setDefaultDates();
            loadSpecificUsers();
        });

        // Set default date range (last 30 days)
        function setDefaultDates() {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 30);
            
            document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
            document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
        }

        // Show/hide loading
        function showLoading(show = true) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Load specific users data
        async function loadSpecificUsers() {
            try {
                showLoading(true);
                
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const status = document.getElementById('statusFilter').value;
                const taskId = document.getElementById('taskIdFilter').value;
                
                let url = `${API_BASE}/users/branches/specific`;
                const params = new URLSearchParams();
                
                if (startDate && endDate) {
                    params.append('startDate', startDate);
                    params.append('endDate', endDate);
                }
                if (status) params.append('status', status);
                if (taskId) params.append('taskId', taskId);
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                renderUserSummaries(data.userSummaries);
                renderBranchesTable(data.branches);
                
            } catch (error) {
                console.error('Error loading specific users data:', error);
                showError('Failed to load user data');
            } finally {
                showLoading(false);
            }
        }

        // Render user summaries
        function renderUserSummaries(userSummaries) {
            const container = document.getElementById('userSummaries');
            
            if (!userSummaries || Object.keys(userSummaries).length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d;">No user data available</p>';
                return;
            }
            
            container.innerHTML = `
                <div class="stats-grid">
                    ${Object.entries(userSummaries).map(([userId, stats]) => `
                        <div class="stat-item">
                            <div style="font-size: 1.2rem; font-weight: 700; color: #2c3e50; margin-bottom: 10px;">
                                ${userId}
                            </div>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                                <div>
                                    <div class="stat-value">${stats.totalBranches}</div>
                                    <div class="stat-label">Total Branches</div>
                                </div>
                                <div>
                                    <div class="stat-value">${stats.activeBranches}</div>
                                    <div class="stat-label">Active</div>
                                </div>
                                <div>
                                    <div class="stat-value">${stats.mergedBranches}</div>
                                    <div class="stat-label">Merged</div>
                                </div>
                                <div>
                                    <div class="stat-value">${stats.totalCommits}</div>
                                    <div class="stat-label">Commits</div>
                                </div>
                                <div>
                                    <div class="stat-value">${(stats.avgWaitingTime || 0).toFixed(1)}h</div>
                                    <div class="stat-label">Avg Wait Time</div>
                                </div>
                                <div>
                                    <div class="stat-value">${(stats.avgDevelopmentTime || 0).toFixed(1)}h</div>
                                    <div class="stat-label">Avg Dev Time</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Render branches table
        function renderBranchesTable(branches) {
            const container = document.getElementById('branchesTable');
            
            if (!branches || branches.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 40px;">No branches found</p>';
                return;
            }
            
            container.innerHTML = `
                <table class="branches-table">
                    <thead>
                        <tr>
                            <th>Branch Name</th>
                            <th>User</th>
                            <th>Status</th>
                            <th>Task ID</th>
                            <th>Commits</th>
                            <th>Dev Time</th>
                            <th>Review Time</th>
                            <th>Total Time</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${branches.map(branch => `
                            <tr>
                                <td>
                                    <div style="font-weight: 600; color: #2c3e50;">${branch.branchName}</div>
                                    <div style="font-size: 0.8rem; color: #7f8c8d;">${branch.repository}</div>
                                </td>
                                <td>
                                    <div style="font-weight: 600; color: #2c3e50;">${branch.userName}</div>
                                    <div style="font-size: 0.8rem; color: #7f8c8d;">${branch.userId}</div>
                                </td>
                                <td>
                                    <span class="status-badge status-${branch.status}">${branch.status}</span>
                                </td>
                                <td>
                                    <div style="font-size: 0.9rem;">
                                        ${branch.taskId || 'N/A'}
                                    </div>
                                </td>
                                <td>
                                    <span style="font-weight: 600; color: #27ae60;">${branch.metrics.commits || 0}</span>
                                </td>
                                <td>
                                    <span style="font-weight: 600; color: #e67e22;">${(branch.waitingTimes.development || 0).toFixed(1)}h</span>
                                </td>
                                <td>
                                    <span style="font-weight: 600; color: #3498db;">${(branch.waitingTimes.review || 0).toFixed(1)}h</span>
                                </td>
                                <td>
                                    <span style="font-weight: 600; color: #e74c3c;">${(branch.waitingTimes.total || 0).toFixed(1)}h</span>
                                </td>
                                <td>
                                    <div style="font-size: 0.9rem;">
                                        ${new Date(branch.createdAt).toLocaleDateString()}
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
    </script>
</body>
</html>
